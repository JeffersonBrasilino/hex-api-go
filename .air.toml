[build]
  args_bin = []
  bin = "./tmp/main"
  cmd = 'CGO_ENABLED=0 go build -mod=vendor -gcflags=all="-N -l" -o tmp/main cmd/api/main.go'
  delay = 100
  exclude_dir = ["assets", "tmp","vendor"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = "dlv exec ./tmp/main --listen=:2345 --headless=true --api-version=2 --accept-multiclient --continue --"
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html"]
  kill_delay = "0s"
  log = "build-errors.log"
  send_interrupt = false
  stop_on_error = true
[color]
  app = "red"
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"
[log]
  time = true
[misc]
  clean_on_exit = false
[screen]
  clear_on_rebuild = false